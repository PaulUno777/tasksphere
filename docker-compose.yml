services:
  # Backend service
  tasksphere-api:
    build:
      context: ./tasksphere-api
      dockerfile: Dockerfile
      target: development
    container_name: tasksphere-api
    ports:
      - "3000:3000"
    env_file:
      - ./tasksphere-api/.env
    volumes:
      - ./tasksphere-api:/app
      - backend_data:/app/data
    networks:
      - tasksphere-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  redis:
    image: redis:7-alpine
    container_name: tasksphere-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tasksphere-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend service (Angular)
