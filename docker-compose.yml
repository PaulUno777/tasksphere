  #   depends_on:
  #     - backend
  #   restart: unless-stopped

  # Redis for caching (optional, can be used instead of memory cache)
  

volumes:
  backend_data:
    driver: local
  redis_data:
    driver: local

networks:
  tasksphere-network:
    driver: bridge